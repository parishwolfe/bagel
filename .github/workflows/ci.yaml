name: Market data checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: bagel
          POSTGRES_USER: bagel_admin
          POSTGRES_PASSWORD: bagel-local-admin
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U bagel_admin -d bagel'
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      BAGEL_TEST_DATABASE_URL: postgresql://bagel_admin:bagel-local-admin@127.0.0.1:5432/bagel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install poetry==2.3.4
      - run: python -m venv .venv
      - run: poetry install --no-interaction
      - run: poetry check --lock
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run pyright
      - run: poetry run pytest -q
      - run: docker compose config --quiet
      - run: docker build -t bagel-market-data:ci .
      - run: docker run --rm bagel-market-data:ci backfill --dry-run
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/gcp
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate
