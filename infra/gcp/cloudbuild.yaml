steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/bagel/market-data:$BUILD_ID', .]
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/bagel/market-data:$BUILD_ID'
substitutions:
  _REGION: us-east4
options:
  logging: CLOUD_LOGGING_ONLY
serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/bagel-build@$PROJECT_ID.iam.gserviceaccount.com'
