repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      # Linter — autofix is enabled via --fix.
      - id: ruff-check
        args: [--fix]
      # Formatter.
      - id: ruff-format
