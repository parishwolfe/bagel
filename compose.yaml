name: bagel-local-supabase

x-app: &app
  image: bagel-market-data:local
  build: .
  read_only: true
  tmpfs:
    - /tmp
  environment:
    DATABASE_URL: postgresql://bagel_worker:bagel-local-worker@supabase_db_bagel:5432/postgres
    ALPACA_ENDPOINT: https://paper-api.alpaca.markets
    ALPACA_API_KEY: ${ALPACA_API_KEY:-}
    ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
    BAGEL_SYMBOLS: ${BAGEL_SYMBOLS:-SPY,QQQ,IWM,VXUS}
    BAGEL_FEED: ${BAGEL_FEED:-iex}
    BAGEL_MAX_HISTORY_YEARS: ${BAGEL_MAX_HISTORY_YEARS:-5}
    BAGEL_AUTO_BACKFILL: ${BAGEL_LOCAL_AUTO_BACKFILL:-false}
    BAGEL_STREAM_ENABLED: ${BAGEL_LOCAL_STREAM_ENABLED:-false}
    BAGEL_BACKFILL_WORKERS: ${BAGEL_BACKFILL_WORKERS:-4}
    BAGEL_DATABASE_BUDGET_MB: ${BAGEL_DATABASE_BUDGET_MB:-450}
    BAGEL_WATCHLIST_POLL_SECONDS: ${BAGEL_WATCHLIST_POLL_SECONDS:-30}
    BAGEL_HISTORY_START: ${BAGEL_HISTORY_START:-}
    BAGEL_HISTORY_END: ${BAGEL_HISTORY_END:-}
    BAGEL_HISTORICAL_DELAY_MINUTES: ${BAGEL_HISTORICAL_DELAY_MINUTES:-15}
    BAGEL_WINDOW_OPEN: ${BAGEL_WINDOW_OPEN:-04:00}
    BAGEL_WINDOW_CLOSE: ${BAGEL_WINDOW_CLOSE:-20:00}
    BAGEL_HEALTH_PORT: 9090
  networks:
    - local-supabase

services:
  market-data:
    <<: *app
    command: ["run"]
    restart: on-failure:5
    ports:
      - "127.0.0.1:9090:9090"
    stop_grace_period: 10s

  tools:
    <<: *app
    profiles: ["tools"]
    command: ["--help"]
    healthcheck:
      disable: true

networks:
  local-supabase:
    name: bagel-local-supabase
    external: true
