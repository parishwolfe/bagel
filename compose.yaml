name: bagel-local-supabase

x-market: &market
  image: bagel-market:local
  build: .
  read_only: true
  tmpfs:
    - /tmp
  networks:
    - local-supabase

x-ingestion: &ingestion
  <<: *market
  environment:
    DATABASE_URL: postgresql://bagel_worker:bagel-local-worker@supabase_db_bagel:5432/postgres
    ALPACA_ENDPOINT: https://paper-api.alpaca.markets
    ALPACA_API_KEY: ${ALPACA_API_KEY:-}
    ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
    BAGEL_SYMBOLS: ${BAGEL_SYMBOLS:-SPY,QQQ,IWM,VXUS}
    BAGEL_FEED: ${BAGEL_FEED:-iex}
    BAGEL_MAX_HISTORY_YEARS: ${BAGEL_MAX_HISTORY_YEARS:-5}
    BAGEL_AUTO_BACKFILL: ${BAGEL_LOCAL_AUTO_BACKFILL:-false}
    BAGEL_STREAM_ENABLED: ${BAGEL_LOCAL_STREAM_ENABLED:-false}
    BAGEL_BACKFILL_WORKERS: ${BAGEL_BACKFILL_WORKERS:-4}
    BAGEL_DATABASE_BUDGET_MB: ${BAGEL_DATABASE_BUDGET_MB:-450}
    BAGEL_WATCHLIST_POLL_SECONDS: ${BAGEL_WATCHLIST_POLL_SECONDS:-30}
    BAGEL_HISTORY_START: ${BAGEL_HISTORY_START:-}
    BAGEL_HISTORY_END: ${BAGEL_HISTORY_END:-}
    BAGEL_HISTORICAL_DELAY_MINUTES: ${BAGEL_HISTORICAL_DELAY_MINUTES:-15}
    BAGEL_WINDOW_OPEN: ${BAGEL_WINDOW_OPEN:-04:00}
    BAGEL_WINDOW_CLOSE: ${BAGEL_WINDOW_CLOSE:-20:00}
    BAGEL_HEALTH_PORT: 9090
x-research: &research
  <<: *market
  entrypoint: ["bagel-research"]
  volumes:
    - research-artifacts:/app/research

x-research-env: &research-env
  BAGEL_RESEARCH_DATABASE_URL: postgresql://bagel_research_worker:bagel-local-research@supabase_db_bagel:5432/postgres
  BAGEL_RESEARCH_ARTIFACTS: /app/research

services:
  research-api:
    <<: *research
    command: ["serve", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      <<: *research-env
      BAGEL_RESEARCH_AUTH_URL: http://supabase_kong_bagel:8000
      BAGEL_RESEARCH_AUTH_KEY: ${BAGEL_RESEARCH_AUTH_KEY:-}
      BAGEL_RESEARCH_OPERATOR_IDS: ${BAGEL_RESEARCH_OPERATOR_IDS:-[]}
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"]

  research-worker:
    <<: *research
    command: ["work"]
    environment: *research-env
    healthcheck:
      disable: true

  market-data:
    <<: *ingestion
    profiles: ["ingest"]
    command: ["run"]
    restart: on-failure:5
    ports:
      - "127.0.0.1:9090:9090"
    stop_grace_period: 10s

  tools:
    <<: *ingestion
    profiles: ["tools"]
    command: ["--help"]
    healthcheck:
      disable: true

networks:
  local-supabase:
    name: bagel-local-supabase
    external: true

volumes:
  research-artifacts:
