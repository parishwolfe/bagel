name: bagel

services:
  api:
    container_name: bagel-api
    image: bagel-market:local
    build: .
    env_file: .env
    entrypoint: ["bagel-api"]
    command: ["--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      # localhost in .env is for host tools; containers use the Compose service.
      DB_HOST: db
      DB_PORT: "5432"
      DATABASE_URL: ""
      BAGEL_ARTIFACTS: /app/research
      # Provider access remains on hold, regardless of other .env settings.
      BAGEL_INGESTION_ENABLED: "false"
      BAGEL_AUTO_BACKFILL: "false"
      BAGEL_STREAM_ENABLED: "false"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - research-artifacts:/app/research
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db:
    container_name: bagel-db
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PGDATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      PGUSER: ${DB_USER:?Set DB_USER in .env}
    ports:
      - "${DB_PORT:?Set DB_PORT in .env}:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
      - ./database/ddl:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The temporary initialization server does not listen on TCP.
      test: ["CMD", "pg_isready", "--host", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  database-data:
  research-artifacts:
