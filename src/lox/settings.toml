# Operational settings only. Strategy parameters belong in the strategy's Python.
catalog = "data/catalog"
capital = 50000
workers = 2
max_trials = 2000
timeout_seconds = 120
memory_mb = 4096 # Linux address-space limit; use an OS/container limit on macOS.
min_free_mb = 1024
commission_per_order = 0.0
stress_commission_per_order = 1.0
validation_finalists = 3
candidate_annual_return = 0.36

# Endpoints are exclusive. Data after validation_end is the untouched vault.
[windows.1min]
train_start = "2024-11-14"
train_end = "2026-01-01"
validation_end = "2026-09-01"

[windows.1day]
train_start = "2011-11-16"
train_end = "2020-01-01"
validation_end = "2025-01-01"
