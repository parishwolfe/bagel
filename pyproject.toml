[project]
name = "bagel"
version = "0.1.0"
description = "Bagel algorithmic trading platform: market-data foundation"
authors = [{name = "Bagel contributors"}]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alpaca-py>=0.43,<0.44",
    "httpx>=0.28,<0.29",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "python-dotenv>=1.2,<2",
    "typer>=0.16,<1",
    "prometheus-client>=0.22,<1",
    "websockets>=15,<18",
    "fastapi>=0.115,<1",
    "pyarrow>=23,<27",
    "uvicorn>=0.34,<1",
]

[project.scripts]
bagel-market-data = "market.data.cli:app"
bagel-research = "market.research.cli:app"

[tool.poetry]
packages = [{include = "market"}]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.12,<1"
pyright = ">=1.1.400,<2"

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["market", "tools"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
